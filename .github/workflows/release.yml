name: Build release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check release version
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected = f"v{version}"
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(f"Release tag must be {expected}; update pyproject.toml before tagging.")
          PY
      - name: Build wheel and source archive
        run: |
          python -m pip install build twine pipx
          python -m build
          python -m twine check dist/*
      - name: Verify pipx installation
        run: |
          pipx install dist/*.whl
          pipx runpip thecook check
          thecook_pipx_bin="$(pipx environment --value PIPX_BIN_DIR)"
          cd "$RUNNER_TEMP"
          "$thecook_pipx_bin/thecook" --version
          "$thecook_pipx_bin/thecook" --help
      - name: Check time and protocol decoding
        if: hashFiles('tests/**/test_*.py') != ''
        run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v5
        with:
          name: thecook-packages
          path: dist/*
      - name: Create GitHub release with packages
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.whl dist/*.tar.gz \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "The Cook $RELEASE_TAG" --generate-notes
          fi
