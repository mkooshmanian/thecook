name: Build release packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected = f"v{version}"
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(f"Release tag must be {expected}; update pyproject.toml before tagging.")
          PY
      - name: Build wheel and source archive
        run: |
          python -m pip install build twine pipx
          python -m build
          python -m twine check dist/*
      - name: Verify pipx installation
        run: |
          pipx install dist/*.whl
          pipx runpip thecook check
          cd "$RUNNER_TEMP"
          "$HOME/.local/bin/thecook" --version
          "$HOME/.local/bin/thecook" --help
      - uses: actions/upload-artifact@v5
        with:
          name: thecook-packages
          path: dist/*
      - name: Attach packages to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
